  <style>
    /* ─── Contact Hero ───────────────────────────── */
    .contact-hero {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7rem 2rem 4rem;
      text-align: center;
      position: relative;
    }
    .contact-hero-inner {
      max-width: 580px;
      width: 100%;
    }

    /* ─── Eyebrow ──────────────────────────────── */
    .contact-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      font-family: var(--font-mono);
      color: var(--accent);
      background: var(--accent-subtle);
      border: 1px solid var(--accent-border);
      margin-bottom: 1.25rem;
    }
    .contact-eyebrow svg {
      width: 12px;
      height: 12px;
    }

    /* ─── Title ──────────────────────────────────── */
    .contact-title {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .contact-title span {
      color: var(--accent);
    }
    .contact-sub {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      text-wrap: balance;
    }

    /* ─── Email Card ─────────────────────────────── */
    .contact-email {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 40px;
      border-radius: var(--radius);
      background: var(--accent-subtle);
      border: 1px solid var(--accent-border);
      font-size: 1.15rem;
      color: var(--accent);
      font-weight: 600;
      transition: all var(--transition);
      text-decoration: none;
      margin-bottom: 3rem;
    }
    .contact-email:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(26,75,140,0.12);
    }
    .contact-email svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ─── Social Grid ────────────────────────────── */
    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      width: 100%;
    }

    .social-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1.25rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition);
      overflow: hidden;
    }
    .social-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      opacity: 0;
      transition: opacity var(--transition);
    }
    .social-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: transparent;
    }
    .social-card:hover::before {
      opacity: 1;
    }
    .social-card:active {
      transform: translateY(-3px);
    }

    /* Per-platform accent */
    .social-card.wechat::before { background: linear-gradient(90deg, #07C160, #06AD56); }
    .social-card.instagram::before { background: linear-gradient(90deg, #F58529, #DD2A7B, #8134AF); }
    .social-card.github::before { background: linear-gradient(90deg, #333, #24292e); }
    [data-theme="dark"] .social-card.github::before { background: linear-gradient(90deg, #f0f6fc, #8b949e); }

    .social-card.wechat:hover { border-color: #07C16033; box-shadow: 0 8px 28px rgba(7,193,96,0.12); }
    .social-card.instagram:hover { border-color: #DD2A7B33; box-shadow: 0 8px 28px rgba(221,42,123,0.12); }
    .social-card.github:hover { border-color: #33333333; box-shadow: 0 8px 28px rgba(0,0,0,0.1); }

    .social-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
      transition: all var(--transition);
    }
    .social-card.wechat .social-icon { background: #07C16015; color: #07C160; }
    .social-card.instagram .social-icon { background: #DD2A7B15; color: #DD2A7B; }
    .social-card.github .social-icon { background: #33333310; color: #333; }
    [data-theme="dark"] .social-card.github .social-icon { background: rgba(240,246,252,0.08); color: #f0f6fc; }

    .social-card:hover .social-icon {
      transform: scale(1.08);
    }

    .social-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.15rem;
    }
    .social-handle {
      font-size: 0.8rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      font-weight: 500;
    }
    .social-action {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color var(--transition);
    }
    .social-card:hover .social-action {
      color: var(--text-secondary);
    }
    .social-action svg {
      width: 12px;
      height: 12px;
      transition: transform var(--transition);
    }
    .social-card:hover .social-action svg {
      transform: translateX(2px);
    }

    /* ─── QR Modal ───────────────────────────────── */
    .qr-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s var(--ease-out);
    }
    .qr-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .qr-modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 360px;
      width: calc(100% - 2rem);
      text-align: center;
      position: relative;
      transform: scale(0.92) translateY(12px);
      transition: transform 0.4s var(--ease-out);
      border: 1px solid var(--border);
    }
    .qr-overlay.open .qr-modal {
      transform: scale(1) translateY(0);
    }

    .qr-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--bg-soft);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      font-size: 1.1rem;
    }
    .qr-close:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .qr-image {
      width: 300px;
      height: 300px;
      object-fit: contain;
      margin: 0 auto 1.25rem;
      border-radius: var(--radius-sm);
      background: white;
      padding: 8px;
      border: 1px solid var(--border-light);
    }

    .qr-modal h3 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--text);
    }
    .qr-modal p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .qr-wechat-id {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 0.75rem;
      padding: 6px 16px;
      border-radius: 50px;
      background: #07C16010;
      color: #07C160;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: var(--font-mono);
      border: 1px solid #07C16020;
    }

    /* ─── Footer tweaks ──────────────────────────── */
    .footer { position: relative; }

    /* ─── Responsive ─────────────────────────────── */
    @media (max-width: 768px) {
      .social-grid {
        grid-template-columns: 1fr;
        gap: 0.875rem;
      }
      .social-card {
        flex-direction: row;
        text-align: left;
        padding: 1.25rem 1.25rem;
        gap: 1rem;
      }
      .social-card .social-icon {
        margin-bottom: 0;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
      }
      .social-card .social-info {
        flex: 1;
        min-width: 0;
      }
      .social-card .social-action {
        margin-top: 0;
        flex-shrink: 0;
      }
      .contact-email {
        width: 100%;
        justify-content: center;
        font-size: 1.05rem;
        padding: 16px 24px;
      }
      .qr-modal {
        padding: 1.75rem;
      }
      .qr-image {
        width: 240px;
        height: 240px;
      }
    }

    @media (max-width: 480px) {
      .contact-hero {
        padding: 5rem 1.25rem 3rem;
      }
    }
  </style>

  <script>
    (function() {
      'use strict';

      // ─── WeChat QR Modal ────────────────────────
      var wechatBtn = document.getElementById('wechatBtn');
      var qrOverlay = document.getElementById('qrOverlay');
      var qrClose = document.getElementById('qrClose');

      function openQR() {
        qrOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeQR() {
        qrOverlay.classList.remove('open');
        document.body.style.overflow = '';
      }

      if (wechatBtn) {
        wechatBtn.addEventListener('click', openQR);
        wechatBtn.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openQR(); }
        });
      }

      if (qrClose) {
        qrClose.addEventListener('click', closeQR);
      }

      if (qrOverlay) {
        qrOverlay.addEventListener('click', function(e) {
          if (e.target === qrOverlay) closeQR();
        });
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && qrOverlay.classList.contains('open')) closeQR();
        });
      }
    })();
  </script>
