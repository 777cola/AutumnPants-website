<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>赏 · 音乐 — AutumnPants</title>
<style>
/* ═══════════════════════════════════════════════════════
   RESET & BASE — shadergradient.co 风格
   ═══════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{background:#08080c;overflow-x:hidden;scroll-behavior:smooth}
body{background:#08080c;color:#e2deec;font-family:"Inter","PingFang SC","Noto Sans SC",-apple-system,sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,100,180,.12);border-radius:3px}

/* ═══════════════════════════════════════════════════════
   THREE.JS BACKGROUND
   ═══════════════════════════════════════════════════════ */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
/* grain removed */

/* ═══════════════════════════════════════════════════════
   LOADING
   ═══════════════════════════════════════════════════════ */
#loading{position:fixed;inset:0;z-index:9999;background:#08080c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .8s,visibility .8s}
#loading.hidden{opacity:0;visibility:hidden}
#loading .dots{display:flex;gap:6px}
#loading .dots span{width:5px;height:5px;border-radius:50%;background:linear-gradient(135deg,#8870c8,#6b54b8);animation:ld 1.3s infinite}
#loading .dots span:nth-child(2){animation-delay:.18s}
#loading .dots span:nth-child(3){animation-delay:.36s}
#loading .label{font-size:.55rem;letter-spacing:.35em;color:rgba(136,112,200,.2);text-transform:uppercase}
@keyframes ld{0%,100%{opacity:.08;transform:scale(.5) translateY(3px)}50%{opacity:1;transform:scale(1) translateY(-3px)}}

/* ═══════════════════════════════════════════════════════
   SCROLL PROGRESS — LineSidebar 风格 (右侧)
   ═══════════════════════════════════════════════════════ */
.scroll-progress{
  position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:50;
  display:flex;flex-direction:column;align-items:flex-end;gap:12px;
  pointer-events:none;
}
.scroll-progress *{pointer-events:auto}

/* ── 控件行（播放按钮 + 音量滑块），与标记线对齐 ── */
.sp-controls{
  position:relative;
  transform:translateX(calc(-1*var(--marker-len,48px) - var(--marker-gap,10px)));
  display:flex;align-items:center;gap:8px;
  width:100%;margin-bottom:4px;
}
.sp-controls .sp-music{
  flex-shrink:0;
  width:28px;height:28px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.25);backdrop-filter:blur(8px);
  color:rgba(255,255,255,.5);font-size:.7rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .3s;opacity:.6;
}
.sp-controls .sp-music:hover{opacity:1;border-color:#8870c8;color:#8870c8}
.sp-controls .sp-music.playing{animation:spmpulse 2s infinite}
@keyframes spmpulse{0%,100%{box-shadow:0 0 4px rgba(136,112,200,.04)}50%{box-shadow:0 0 10px rgba(136,112,200,.12)}}

/* ── 音量滑块（ElasticSlider 风格） ── */
.sp-vol{
  flex:1;min-width:0;
  position:relative;height:24px;
  display:flex;align-items:center;cursor:pointer;
  touch-action:none;user-select:none;
}
.sp-vol-track{
  position:relative;width:100%;height:2px;
  background:rgba(255,255,255,.06);border-radius:2px;
  overflow:hidden;transition:height .25s;
}
.sp-vol:hover .sp-vol-track{height:3px}
.sp-vol-range{
  position:absolute;left:0;top:0;height:100%;
  background:#8870c8;border-radius:2px;
  box-shadow:0 0 4px rgba(136,112,200,.1);
  transition:width .05s;
}
.sp-vol-handle{
  position:absolute;top:50%;
  width:10px;height:10px;border-radius:50%;
  background:#8870c8;border:2px solid rgba(255,255,255,.2);
  transform:translate(-50%,-50%) scale(.8);
  opacity:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 0 6px rgba(136,112,200,.2);
}
.sp-vol:hover .sp-vol-handle{opacity:1;transform:translate(-50%,-50%) scale(1)}
.sp-vol.dragging .sp-vol-handle{opacity:1;transform:translate(-50%,-50%) scale(1.2);border-color:#c4b0e8}

/* ── LineSidebar 列表 ── */
.sp-sidebar{
  --accent:#8870c8;
  --text:#6c6c6c;
  --marker:#404040;
  --marker-len:48px;
  --marker-gap:10px;
  --max-shift:24px;
  --item-gap:14px;
  --font-size:.72rem;
  position:relative;
  display:flex;
  justify-content:flex-end;
}
.sp-sidebar .sp-list-wrap{
  padding-right:calc(var(--marker-len) + var(--marker-gap));
}
.sp-sidebar .sp-list{
  list-style:none;margin:0;padding:0;
  display:flex;flex-direction:column;gap:var(--item-gap);
}
.sp-sidebar .sp-item{
  position:relative;cursor:pointer;
  --effect:0;
}
/* 扩大点击区域 */
.sp-sidebar .sp-item::before{
  content:'';position:absolute;inset:-5px -40px;
}
.sp-sidebar .sp-label{
  position:relative;display:inline-flex;align-items:baseline;
  font-size:var(--font-size);line-height:1.2;letter-spacing:.04em;
  color:color-mix(in srgb,var(--accent) calc(var(--effect,0)*100%),var(--text));
  transform:translateX(calc(var(--effect,0)*var(--max-shift)));
  white-space:nowrap;
  transition:color .15s;
}
.sp-sidebar .sp-index{
  font-family:"JetBrains Mono","SF Mono",monospace;
  margin-right:.6rem;font-size:.85em;
  opacity:calc(.4 + var(--effect,0)*.6);
  transition:opacity .15s;
}
/* ── 标记线 ── */
.sp-sidebar .sp-marker{
  position:absolute;top:50%;left:calc(-1*var(--marker-len) - var(--marker-gap));
  height:1px;width:var(--marker-len);
  background:color-mix(in srgb,var(--accent) calc(var(--effect,0)*100%),var(--marker));
  transform-origin:right center;
  transform:translateY(-50%) scaleX(calc(.5 + var(--effect,0)*.5));
  transition:background .15s;
}
/* ── 间隔刻度线 ── */
.sp-sidebar .sp-item:not(:last-child)::after{
  content:'';position:absolute;
  top:calc(100% + var(--item-gap)/2);
  left:calc(-1*var(--marker-len) - var(--marker-gap));
  height:1px;width:calc(var(--marker-len)*.5);
  background:var(--marker);opacity:.35;
  transform:translateY(-50%);
  transform-origin:right center;
}
/* ── 当前激活项 ── */
.sp-sidebar .sp-item.active{
  --effect:1 !important;
}
.sp-sidebar .sp-item.active .sp-label{
  color:var(--accent);
  transform:translateX(var(--max-shift));
}
.sp-sidebar .sp-item.active .sp-marker{
  background:var(--accent);
  transform:translateY(-50%) scaleX(1);
  box-shadow:0 0 8px rgba(136,112,200,.15);
}

/* ═══════════════════════════════════════════════════════
   SCREENS
   ═══════════════════════════════════════════════════════ */
.screen{position:relative;z-index:2;width:100%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:80px 64px;max-width:1000px;margin:0 auto}
@media(max-width:768px){.screen{padding:60px 24px}}

/* ═══════════════════════════════════════════════════════
   HERO — "THE ARCHIVE" 演唱会票据风格
   ═══════════════════════════════════════════════════════ */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:80px 0}
.hero .hero-inner{position:relative;z-index:2;text-align:center;padding:0;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:0}
/* ── 票据齿孔装饰 ── */
.hero .perf{position:absolute;right:0;top:50%;transform:translateY(-50%);width:6px;height:70vh;z-index:1;
  background:radial-gradient(circle at center,rgba(255,255,255,.18) 1.5px,transparent 1.5px);
  background-size:6px 10px;opacity:.6}
.hero .perf.left{left:0;right:auto}
/* ── 主标题 ── */
.hero .wordmark{display:flex;flex-direction:column;align-items:flex-start;gap:0;position:relative;align-self:flex-start}
.hero .wordmark .line1,.hero .wordmark .line2,.hero .wordmark .line3{
  font-size:clamp(4rem,13vw,10rem);font-weight:900;letter-spacing:-.03em;line-height:1;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Heiti SC",sans-serif;
  opacity:0;animation:heroRise .8s cubic-bezier(.16,1,.3,1) forwards;
}
.hero .wordmark .line1{
  background:linear-gradient(180deg,rgba(240,235,250,.95),rgba(200,180,230,.5));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation-delay:.1s;
}
.hero .wordmark .line2{
  background:linear-gradient(180deg,rgba(220,200,240,.7),rgba(160,130,210,.4));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation-delay:.18s;margin-left:16vw;
}
.hero .wordmark .line3{
  background:linear-gradient(180deg,rgba(200,180,230,.5),rgba(120,100,180,.3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation-delay:.26s;margin-left:23vw;
}
@keyframes heroRise{from{opacity:0;transform:translateY(24px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
/* ── 副标题 ── */
.hero .tagline{font-size:.65rem;color:rgba(255,255,255,.08);letter-spacing:.3em;margin-top:6px;
  opacity:0;animation:heroRise .6s .5s forwards;text-transform:uppercase}
/* ── 统计卡片 ── */
.hero .stat-cards{display:flex;gap:20px;margin-top:36px;opacity:0;animation:heroRise .6s .7s forwards}
.hero .stat-card{
  padding:14px 28px;text-align:center;min-width:120px;
  position:relative;
}
.hero .stat-card::before{content:none}
.hero .stat-card .n{font-size:2.4rem;font-weight:700;color:#c4b0e8;line-height:1;
  background:linear-gradient(180deg,#e0d4f4,#a088d0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero .stat-card .l{font-size:.45rem;color:rgba(255,255,255,.06);letter-spacing:.25em;margin-top:4px;text-transform:uppercase}
.hero .stat-card .sub{font-size:.4rem;color:rgba(255,255,255,.03);letter-spacing:.15em;margin-top:1px}
/* ── 艺人时间线 ── */
.hero .timeline{margin-top:32px;display:flex;gap:3px;opacity:0;animation:heroRise .6s .85s forwards}
.hero .timeline .t-dot{width:6px;height:6px;border-radius:50%;border:none;padding:0;cursor:pointer;
  background:rgba(255,255,255,.04);transition:all .35s cubic-bezier(.34,1.56,.64,1);position:relative}
.hero .timeline .t-dot:hover,.hero .timeline .t-dot:focus-visible{background:#8870c8;transform:scale(1.6);box-shadow:0 0 10px rgba(136,112,200,.2)}
.hero .timeline .t-dot::after{
  content:attr(data-artist);position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:.45rem;color:rgba(255,255,255,.5);white-space:nowrap;
  opacity:0;transition:opacity .2s;pointer-events:none;letter-spacing:.06em;
}
.hero .timeline .t-dot:hover::after,.hero .timeline .t-dot:focus-visible::after{opacity:1}

/* ═══════════════════════════════════════════════════════
   DIVIDER
   ═══════════════════════════════════════════════════════ */
.divider{position:relative;z-index:2;height:5vh;display:flex;align-items:center;justify-content:center}
.divider .dash{width:1px;height:40%;background:linear-gradient(180deg,transparent,rgba(136,112,200,.05),transparent)}

/* ═══════════════════════════════════════════════════════
   CONCERT SECTION
   ═══════════════════════════════════════════════════════ */
.concert{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center}
.concert .inner{position:relative;z-index:2;width:100%;max-width:1000px;margin:0 auto;padding:80px 64px}
@media(max-width:768px){.concert .inner{padding:60px 24px}}

.concert .number{font-family:"JetBrains Mono","SF Mono",monospace;font-size:.45rem;letter-spacing:.4em;color:rgba(136,112,200,.12);margin-bottom:6px;transition:all .7s;opacity:0;transform:translateY(8px)}
.concert .number.visible{opacity:1;transform:translateY(0)}

.concert .artist{font-size:clamp(2.4rem,6vw,4.5rem);font-weight:650;letter-spacing:-.03em;line-height:1.04;transition:all .7s cubic-bezier(.16,1,.3,1) .04s;opacity:0;transform:translateY(10px)}
.concert .artist.visible{opacity:1;transform:translateY(0)}
.concert .artist span{background:linear-gradient(180deg,#e8e0f4,#a088d0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.concert .tour-name{font-size:.8rem;font-weight:500;color:rgba(255,255,255,.2);letter-spacing:.08em;margin-bottom:3px;transition:all .6s .08s;opacity:0;transform:translateY(6px)}
.concert .tour-name.visible{opacity:1;transform:translateY(0)}

.concert .location{font-size:.6rem;color:rgba(255,255,255,.08);letter-spacing:.06em;margin-bottom:10px;transition:all .6s .12s;opacity:0;transform:translateY(6px)}
.concert .location.visible{opacity:1;transform:translateY(0)}
.concert .location .tag{display:inline-block;margin-left:6px;font-size:.45rem;padding:1px 6px;border:1px solid rgba(136,112,200,.08);border-radius:4px;color:#8870c8;vertical-align:middle}

/* ── 歌词 ── */
.concert .lyric-block{
  margin-top:18px;
  transition:all .7s .14s;opacity:0;transform:translateY(8px);
  position:relative;
}
.concert .lyric-block.visible{opacity:1;transform:translateY(0)}
.concert .lyric-block .text{
  font-size:1.15rem;font-weight:500;line-height:1.7;letter-spacing:.05em;
  color:rgba(200,185,230,.55);
  text-shadow:0 0 18px rgba(136,112,200,.1);
  transition:color .6s;
}
.concert .lyric-block.visible .text{color:rgba(220,210,240,.7)}
.concert .lyric-block .char{
  display:inline;opacity:0;
  transition:opacity .35s;
}
.concert .lyric-block.visible .char{opacity:1}
.concert .lyric-block .song{
  font-size:.55rem;color:rgba(136,112,200,.18);letter-spacing:.1em;margin-top:8px;
  display:flex;align-items:center;gap:8px;
}
.concert .lyric-block .song::before{
  content:'';width:20px;height:1px;background:rgba(136,112,200,.15);
}

/* ── 照片贴纸 ── */
.concert .photos-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.concert .photo-sticker{
  width:96px;height:96px;border-radius:8px;overflow:hidden;
  border:1px solid rgba(255,255,255,.03);
  background:rgba(10,10,15,.5);backdrop-filter:blur(6px);
  transition:all .4s cubic-bezier(.34,1.56,.64,1);
  opacity:0;transform:rotate(-2deg) scale(.88);
  cursor:pointer;position:relative;
  box-shadow:0 2px 12px rgba(0,0,0,.3);
}
.concert .photo-sticker.visible{opacity:1;transform:rotate(0deg) scale(1)}
.concert .photo-sticker:hover{transform:rotate(0deg) scale(1.1);border-color:rgba(136,112,200,.12);z-index:3;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.concert .photo-sticker img{width:100%;height:100%;object-fit:cover;display:block}

/* ── 视频背景 ── */
.concert .vid-bg{
  position:absolute;top:0;left:0;width:100%;height:100%;
  object-fit:cover;opacity:.2;pointer-events:none;z-index:0;
  filter:blur(6px) saturate(0.5) brightness(0.6);
}

/* ── 全屏按钮 ── */
.concert .fs-btn{
  position:absolute;bottom:28px;right:28px;z-index:2;
  width:52px;height:52px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.4);backdrop-filter:blur(10px);
  color:rgba(255,255,255,.8);font-size:1.1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);opacity:.85;
  box-shadow:0 0 12px rgba(255,255,255,.04);
}
.concert .fs-btn:hover{opacity:1;border-color:rgba(136,112,200,.15);color:#8870c8;transform:scale(1.15);box-shadow:0 0 16px rgba(136,112,200,.1)}
.concert .fs-btn.hidden{display:none}

/* ═══════════════════════════════════════════════════════
   FULLSCREEN OVERLAY
   ═══════════════════════════════════════════════════════ */
.fs-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);opacity:0;transition:opacity .4s}
.fs-overlay.on{display:flex;opacity:1}
.fs-overlay .close-btn{position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.3);color:rgba(255,255,255,.4);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;z-index:2}
.fs-overlay .close-btn:hover{background:rgba(255,255,255,.06);color:#fff;transform:rotate(90deg)}
.fs-overlay video{max-width:93vw;max-height:88vh;border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.7);transform:scale(.92);opacity:0;transition:all .45s cubic-bezier(.16,1,.3,1)}
.fs-overlay.on video{transform:scale(1);opacity:1}

/* ═══════════════════════════════════════════════════════
   TOP NAV — matches 听-板块 (nav-blue unified, dark adapted)
   ═══════════════════════════════════════════════════════ */
.topnav{position:fixed;top:0;left:0;right:0;z-index:60;padding:14px 28px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(8,8,12,.92),transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topnav .nav-center{display:flex;align-items:center;gap:24px}
.topnav .nav-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;max-width:1200px}
.topnav .home{font-size:.8rem;color:rgba(255,255,255,.4);text-decoration:none;letter-spacing:.06em;
  display:flex;align-items:center;gap:6px;font-family:'Noto Sans SC',sans-serif}
.topnav .home::before{content:'\2190';font-size:.75rem}
.topnav .home:hover{color:var(--accent)}
.topnav .links{display:flex;gap:0;align-items:center;position:relative;
  background:rgba(255,255,255,.06);border-radius:50px;padding:3px}
.topnav .links a{font-size:.78rem;color:rgba(255,255,255,.35);text-decoration:none;letter-spacing:.08em;
  padding:6px 16px;transition:color .35s;position:relative;z-index:1;border-radius:50px;white-space:nowrap}
.topnav .links a:hover,.topnav .links a.here{color:#fff}
.nav-pill{position:absolute;top:3px;height:calc(100% - 6px);border-radius:50px;
  background:var(--accent,#60a5fa);transition:left .35s cubic-bezier(.65,0,.35,1),width .35s cubic-bezier(.65,0,.35,1);
  z-index:0;pointer-events:none}
.topnav .nav-right{display:flex;align-items:center;gap:.75rem;
  margin-left:auto;position:absolute;right:28px;top:50%;transform:translateY(-50%)}
.theme-toggle{background:none;border:none;cursor:pointer;width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);transition:all .3s}
.theme-toggle:hover{background:rgba(255,255,255,.06);color:#fff}
.theme-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lang-toggle{position:relative;display:flex;align-items:center;height:30px;
  background:rgba(255,255,255,.06);border-radius:20px;padding:2px;gap:0;
  border:1px solid rgba(255,255,255,.08);overflow:hidden;transition:all .3s}
.lang-toggle:hover{border-color:rgba(255,255,255,.2)}
.lang-item{padding:3px 8px;font-size:.72rem;font-weight:600;color:rgba(255,255,255,.35);
  transition:all .2s;white-space:nowrap;border-radius:16px;cursor:pointer;user-select:none;
  font-family:'Noto Sans SC',sans-serif}
.lang-item.active{background:var(--accent,#60a5fa);color:#fff}
.lang-item:not(.active):hover{color:#fff}

/* ═══════════════════════════════════════════════════════
   BOTTOM INFO BAR
   ═══════════════════════════════════════════════════════ */
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:60;padding:14px 28px;
  display:flex;align-items:center;justify-content:center;gap:28px;
  background:linear-gradient(0deg,rgba(8,8,12,.85),transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bottombar span{font-size:.55rem;color:rgba(255,255,255,.08);letter-spacing:.15em}
.bottombar .brand{color:rgba(255,255,255,.14);font-weight:500}
</style>
</head>
<body>

<div id="loading">
  <div class="dots"><span></span><span></span><span></span></div>
  <div class="label" data-i18n="loading">Loading memories</div>
</div>

<canvas id="bg"></canvas>

<!-- 顶部导航 -->
<nav class="topnav">

/* ═══════════════════════════════════════════════════════
   Three.js — shader gradient (非阻塞加载，不影响页面)
   ═══════════════════════════════════════════════════════ */
const threePromise = import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js')
  .then(m => setupThree(m.default || m))
  .catch(() => {});
function setupThree(THREE){
const W=innerWidth,H=innerHeight;
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('bg'),alpha:true});
renderer.setSize(W,H);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));

const uniforms={
  uTime:{value:0},
  uResolution:{value:new THREE.Vector2(W,H)},
  uMouse:{value:new THREE.Vector2(.5,.5)},
  uScroll:{value:0},
};

const vert=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;

const frag=`
  varying vec2 vUv;
  uniform float uTime;
  uniform vec2 uResolution;
  uniform vec2 uMouse;
  uniform float uScroll;

  void main(){
    vec2 uv=vUv;
    vec2 m=uMouse-.5;
    uv.y-=uScroll*.002;

    float t=uTime*.25;
    // 平滑渐变层，无线粒噪声
    float g1=smoothstep(0.,1.,uv.y+uv.x*.3+m.x*.15+sin(t+uv.x*2.)*.08);
    float g2=smoothstep(0.,1.,1.-uv.y+uv.x*.2-m.y*.12+cos(t*.7+uv.y*1.5)*.06);
    float h=g1*.45+g2*.35+.2;

    // 深暗紫黑调
    vec3 c1=vec3(.04,.03,.07);
    vec3 c2=vec3(.10,.08,.15);
    vec3 c3=vec3(.18,.14,.30);
    vec3 col=mix(c1,c2,smoothstep(.2,.5,h));
    col=mix(col,c3,smoothstep(.55,.85,h));

    // 鼠标微光
    float d=length(uv-vec2(.5+m.x*.12,.5+m.y*.12));
    col+=vec3(.025,.018,.05)*(1.-d)*.3;

    gl_FragColor=vec4(col,1.);
  }
`;

const mat=new THREE.ShaderMaterial({uniforms,vertexShader:vert,fragmentShader:frag});
const geo=new THREE.PlaneGeometry(2,2);
const mesh=new THREE.Mesh(geo,mat);
scene.add(mesh);

let mx=.5,my=.5;
addEventListener('mousemove',e=>{mx=e.clientX/W;my=e.clientY/H});
addEventListener('resize',()=>{
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  uniforms.uResolution.value.set(w,h);
});

function animate(time){
  uniforms.uTime.value=time*.001;
  uniforms.uMouse.value.lerp(new THREE.Vector2(mx,my),.04);
  uniforms.uScroll.value=window.scrollY;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
}

// ── 指针感应效果 (LineSidebar 风格) ──
const spItems=list.querySelectorAll('.sp-item');
const targets=new Float64Array(spItems.length);
const current=new Float64Array(spItems.length);
let rafId=null;
let lastTime=0;
const SMOOTHING=100; // ms

function runFrame(now){
  const dt=Math.min((now-lastTime)/1000,.05);
  lastTime=now;
  const tau=SMOOTHING/1000;
  const k=1-Math.exp(-dt/tau);
  let moving=false;
  for(let i=0;i<spItems.length;i++){
    const t=Math.max(targets[i],spItems[i].classList.contains('active')?1:0);
    const cur=current[i];
    const next=cur+(t-cur)*k;
    const settled=Math.abs(t-next)<.0015;
    const val=settled?t:next;
    current[i]=val;
    spItems[i].style.setProperty('--effect',val.toFixed(4));
    if(!settled)moving=true;
  }
  rafId=moving?requestAnimationFrame(runFrame):null;
}

function startLoop(){
  if(rafId!=null)return;
  lastTime=performance.now();
  rafId=requestAnimationFrame(runFrame);
}

list.addEventListener('pointermove',e=>{
  const rect=list.getBoundingClientRect();
  const py=e.clientY-rect.top;
  for(let i=0;i<spItems.length;i++){
    const el=spItems[i];
    const center=el.offsetTop+el.offsetHeight/2;
    const dist=Math.abs(py-center);
    const p=Math.max(0,1-dist/120);
    targets[i]=p*p*(3-2*p); // smooth falloff
  }
  startLoop();
});

list.addEventListener('pointerleave',()=>{
  targets.fill(0);
  startLoop();
});

// ── 滚动时更新激活项 ──
const progOb=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const idx=allScreens.indexOf(e.target);
      spItems.forEach((b,j)=>b.classList.toggle('active',j===idx));
      // 重新触发动画
      for(let i=0;i<spItems.length;i++){
        if(!spItems[i].classList.contains('active')){
          targets[i]=0;
        }
      }
      startLoop();
    }
  });
},{threshold:.2});
allScreens.forEach(s=>progOb.observe(s));

    const dot=fname.lastIndexOf('.');
    const thumbName=dot>-1?`thumb_${fname.slice(0,dot)}${fname.slice(dot)}`:`thumb_${fname}`;
    const thumbSrc=`${c.folder}/${thumbName}`;
    const fullSrc=`${c.folder}/${fname}`;
    const img=new Image();
    img.onload=()=>{
      const sticker=document.createElement('div');
      sticker.className='photo-sticker';
      sticker.style.transitionDelay=`${pi*.07}s`;
      const im=document.createElement('img');
      im.src=thumbSrc;
      im.alt=`${c.artist} ${c.date}`;
      sticker.appendChild(im);
      sticker.addEventListener('click',()=>openFsImg(fullSrc));
      photosRow.appendChild(sticker);
      setTimeout(()=>sticker.classList.add('visible'),40);
      // preload full-res after sticker shows
      const preload=new Image();
      preload.src=fullSrc;
    };
    img.onerror=()=>{
      // fallback: load full-res directly
      const sticker=document.createElement('div');
      sticker.className='photo-sticker';
      sticker.style.transitionDelay=`${pi*.07}s`;
      const im=document.createElement('img');
      im.src=fullSrc;
      im.alt=`${c.artist} ${c.date}`;
      sticker.appendChild(im);
      sticker.addEventListener('click',()=>openFsImg(fullSrc));
      photosRow.appendChild(sticker);
      setTimeout(()=>sticker.classList.add('visible'),40);
    };
    img.src=thumbSrc;
  });

  // ── 加载视频背景 ──
  if(c.videos.length>0 && vidEl){
    const vsrc=`${c.folder}/${c.videos[0]}`;
    vidEl.src=vsrc;
    vidEl.onloadeddata=()=>{
      vidEl.play().catch(()=>{});
      if(fsBtn)fsBtn.classList.remove('hidden');
    };
    vidEl.onerror=()=>{
      if(fsBtn)fsBtn.classList.add('hidden');
    };

    // ── 全屏按钮 ──
    if(fsBtn){
      fsBtn.addEventListener('click',()=>openFs(vidEl));
    }
  }
});

/* ═══════════════════════════════════════════════════════
   BGM — 陶喆《望春风》
   ═══════════════════════════════════════════════════════ */
const BGM_MIN=0.03;
const BGM_MAX=0.15;
const BGM_FADE=5000; // 5s fade-in
bgm.volume=BGM_MIN;

function tryPlayBgm(){
  bgm.play().then(()=>{
    // 播放成功后开始淡入
    const start=performance.now();
    function fadeStep(){
      const elapsed=performance.now()-start;
      const t=Math.min(elapsed/BGM_FADE,1);
      bgm.volume=BGM_MIN+(BGM_MAX-BGM_MIN)*t;
      if(t<1)requestAnimationFrame(fadeStep);
    }
    requestAnimationFrame(fadeStep);
  }).catch(()=>{});
}
let bgmStarted=false;
document.addEventListener('click',()=>{if(!bgmStarted){bgmStarted=true;tryPlayBgm();}},{once:false});
document.addEventListener('scroll',()=>{if(!bgmStarted){bgmStarted=true;tryPlayBgm();}},{once:false});
setTimeout(()=>{if(!bgmStarted){bgmStarted=true;tryPlayBgm();}},800);

// 音量滑块初始值同步
setVol(bgm.volume/BGM_MAX);

/* ═══════════════════════════════════════════════════════
   FULLSCREEN CLOSE — 恢复 BGM
   ═══════════════════════════════════════════════════════ */
const fsOver=document.getElementById('fsOver');
const fsVid=document.getElementById('fsVid');
const fsImg=document.getElementById('fsImg');
const fsClose=document.getElementById('fsClose');

function openFs(vidEl){
  fsImg.style.display='none';
  fsVid.style.display='';
  fsVid.src=vidEl.src;
  fsVid.currentTime=vidEl.currentTime;
  fsOver.classList.add('on');
  bgm.pause();
  fsVid.play().catch(()=>{});
}

function openFsImg(src){
  fsVid.style.display='none';
  fsVid.pause();fsVid.src='';fsVid.load();
  fsImg.src=src;
  fsImg.style.display='';
  fsOver.classList.add('on');
  bgm.pause();
}

function closeFs(){
  fsOver.classList.remove('on');
  fsVid.pause();
  fsImg.src='';
  setTimeout(()=>{
    fsVid.src='';fsVid.load();
    fsImg.style.display='none';
    fsVid.style.display='';
    bgm.volume=BGM_MAX;
    bgm.play().catch(()=>{});
  },300);
}
fsClose.addEventListener('click',closeFs);
fsOver.addEventListener('click',e=>{if(e.target===fsOver)closeFs();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&fsOver.classList.contains('on'))closeFs();});

/* ═══════════════════════════════════════════════════════
   HIDE LOADING
   ═══════════════════════════════════════════════════════ */
setTimeout(()=>document.getElementById('loading').classList.add('hidden'),1200);

/* ═══════════════════════════════════════════════════════
   SCROLL LIMIT — 底部限位，不让滑过最后一场
   ═══════════════════════════════════════════════════════ */
let maxScroll=0;
function updateMaxScroll(){
  const lastConcert=document.querySelectorAll('.concert');
  const last=lastConcert[lastConcert.length-1];
  if(!last)return;
  const rect=last.getBoundingClientRect();
  maxScroll=window.scrollY+rect.bottom-window.innerHeight+40;
}
let scrollTicking=false;
window.addEventListener('scroll',()=>{
  if(!scrollTicking){
    requestAnimationFrame(()=>{
      updateMaxScroll();
      if(window.scrollY>maxScroll)window.scrollTo({top:maxScroll,behavior:'instant'});
      scrollTicking=false;
    });
    scrollTicking=true;
  }
},{passive:false});
window.addEventListener('resize',updateMaxScroll);
setTimeout(updateMaxScroll,1500);

// ─── Nav: Lang Toggle ─────────────────
let currentLang = 'zh';
function applyLang(lang){
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.querySelectorAll('.lang-item').forEach(el => el.classList.toggle('active', el.dataset.lang === lang));
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if(I18N[lang] && I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  // Rebuild dynamic content
  updateHeroText(lang);
  updateSidebarLabels(lang);
  updateBgmTip(lang);
  updateConsoleLog(lang);
}
function loadLang(){
  const saved = localStorage.getItem('lang') || 'zh';
  applyLang(saved);
}
document.getElementById('langToggle')?.addEventListener('click', (e) => {
  const item = e.target.closest('.lang-item');
  if (item) applyLang(item.dataset.lang);
});

// ─── Dynamic text updaters ─────────────
function updateHeroText(lang){
  const lines = document.querySelectorAll('.wordmark .line1, .wordmark .line2, .wordmark .line3');
  const keys = ['hero.line1','hero.line2','hero.line3'];
  lines.forEach((el,i)=>{
    if(I18N[lang] && I18N[lang][keys[i]]) el.textContent = I18N[lang][keys[i]];
  });
  const tagline = document.querySelector('.hero .tagline');
  if(tagline && I18N[lang] && I18N[lang]['hero.tagline']) tagline.textContent = I18N[lang]['hero.tagline'];
  const artistSub = document.querySelectorAll('.hero .stat-card .sub');
  if(artistSub.length>=2){
    if(I18N[lang] && I18N[lang]['hero.artists']) artistSub[0].textContent = I18N[lang]['hero.artists'];
    if(I18N[lang] && I18N[lang]['hero.shows']) artistSub[1].textContent = I18N[lang]['hero.shows'];
  }
}
function updateSidebarLabels(lang){
  document.querySelectorAll('.sp-item .sp-label .sp-label-text').forEach(el => {
    if(el.dataset.i18n && I18N[lang] && I18N[lang][el.dataset.i18n]){
      el.textContent = I18N[lang][el.dataset.i18n];
    }
  });
}
function updateBgmTip(lang){
  document.querySelectorAll('[data-i18n-tip]').forEach(el => {
    const key = el.dataset.i18nTip;
    if(I18N[lang] && I18N[lang][key]) el.setAttribute('data-tip', I18N[lang][key]);
  });
}

}

// ─── Nav: Pill ────────────────────────
(function(){
  const links = document.querySelector('.topnav .links');
  if (!links) return;
  const pill = links.querySelector('.nav-pill');
  if (!pill) return;
  const items = links.querySelectorAll('a');
  function move(target) {
    pill.style.left = target.offsetLeft + 'px';
    pill.style.width = target.offsetWidth + 'px';
  }
  const active = links.querySelector('a.here');
  if (active) move(active);
  items.forEach(item => item.addEventListener('mouseenter', () => move(item)));
  links.addEventListener('mouseleave', () => {
    const a = links.querySelector('a.here');
    if (a) move(a);
  });
  window.addEventListener('resize', () => {
    const a = links.querySelector('a.here');
    if (a) move(a);
  });
})();
